events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 10M;

    # Compress text assets; see docs/deploy/nginx.md ("Static-asset delivery").
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml application/manifest+json;

    # Leaderboard API: 30 req/min per IP, burst 20.
    limit_req_zone $binary_remote_addr zone=leaderboard:10m rate=30r/m;

    # Answer throttled requests with 429, as the NestJS throttler does.
    limit_req_status 429;

    # Auth API: 60 req/min; covers /api/auth/me and /api/auth/logout, which
    # the SPA calls on every page load and in every tab.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Refresh: 30 req/min, matching the @Throttle on the route.
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=30r/m;

    # WebSocket upgrade: "upgrade" when requested, otherwise "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Re-resolve Docker service names every 10s (see docs/deploy/nginx.md).
    resolver 127.0.0.11 valid=10s;

    # HTTPS server: serves the SPA and proxies API/WebSocket traffic.
    server {
        # No plain-HTTP server: port 443 only.
        listen 443 ssl;
        listen [::]:443 ssl;

        # Must match the certificate's CN.
        server_name transcendence-ludo;

        # TLS 1.2/1.3 only.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://assets.codepen.io; img-src 'self' data: https:; connect-src 'self' ws: wss:;" always;

        # SPA build output.
        root /usr/share/nginx/html;
        index index.html;

        # /assets/ is content-hashed, so cache it for a year; index.html names
        # the current hashes, so it must be revalidated. See docs/deploy/nginx.md
        # for why both use `expires` rather than `add_header`.
        location /assets/ {
            expires 1y;
        }

        # Exact match; `/` lands here too, via try_files.
        location = /index.html {
            expires -1;
        }

        # SPA routes: anything that is not a file serves index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # GET-only; exact match, so it wins over the /api/ prefix.
        location = /api/leaderboard {
            if ($request_method !~ ^(GET)$) {
                return 405;
            }
            limit_req zone=leaderboard burst=20 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Per-IP throttled more tightly than the /api/ prefix.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exact match, so it wins over the /api/auth/ prefix.
        location = /api/auth/refresh {
            limit_req zone=refresh burst=15 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forwards /api/* requests to the backend.
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # /api/notifications/stream is SSE: keep buffering off and do not
            # cut the stream at the 60s default (see docs/deploy/nginx.md).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Health check; the backend mounts /health at its root, not under /api.
        location = /api/health {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/health;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Socket.IO proxy: a same-origin TLS path to the engine, so the browser
        # never calls ludo-engine:3001 directly.
        location /socket.io/ {
            set $engine_upstream http://ludo-engine:3001;
            proxy_pass $engine_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep idle game sockets open longer than the 60s default.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Deny hidden files (.env, .git).
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
